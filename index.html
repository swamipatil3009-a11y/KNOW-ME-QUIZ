
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How Well Do You Know Me? 💜</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:22px 14px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fdfbff,#eee5ff);color:#30234a;min-height:100vh}
.card{max-width:540px;margin:20px auto;background:white;padding:25px;border-radius:24px;box-shadow:0 8px 30px #7352a522}
h1{text-align:center;color:#8054c7;margin:4px 0 10px}
.sub{text-align:center;color:#77698b;line-height:1.5}
input{width:100%;padding:14px;border:2px solid #e4d7ff;border-radius:12px;font-size:16px;margin:12px 0}
button{border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:bold;cursor:pointer}
.primary{width:100%;background:#8b5bd6;color:white;margin-top:10px}
.option{width:100%;margin:6px 0;background:#f2eaff;color:#49356a;text-align:left;border:2px solid transparent}
.option:nth-of-type(2){background:#e6f6ff}
.option:nth-of-type(3){background:#fff0f5}
.option:nth-of-type(4){background:#fff4d9}
.option.selected{border-color:#8054c7}
.option.correct{background:#d9f8e5;border-color:#38a66b}
.option.wrong{background:#ffe0e6;border-color:#e66c85}
.progress{height:8px;background:#eee5ff;border-radius:20px;overflow:hidden;margin:20px 0}
#bar{height:100%;width:0;background:#9867df;transition:width .2s}
.small{font-size:13px;color:#847694;text-align:center}
#question{line-height:1.45}
#message{text-align:center;line-height:1.5;margin-top:14px}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <h1>How Well Do You Know Me? 💜</h1>
  <p class="sub">Think you know me? Let's find out! ✨</p>

  <section id="welcome">
    <p>Enter your name or nickname to start the quiz.</p>
    <input id="playerName" maxlength="30" placeholder="Your name or nickname">
    <button class="primary" onclick="startQuiz()">Start Quiz 💜</button>
    <p class="small">Your score will be submitted when you finish.</p>
  </section>

  <section id="quiz" class="hidden">
    <p class="small" id="counter"></p>
    <div class="progress"><div id="bar"></div></div>
    <h3 id="question"></h3>
    <div id="options"></div>
    <button class="primary" id="next" onclick="nextQuestion()" disabled>Next ➜</button>
    <p class="small">Choose one answer for each question.</p>
  </section>

  <section id="result" class="hidden">
    <h2 style="text-align:center">Quiz Completed! 🎉</h2>
    <h1 id="score"></h1>
    <p id="feedback" class="sub"></p>
    <p id="message">Submitting your result…</p>
    <button class="primary" onclick="restartQuiz()">Play Again 🔄</button>
  </section>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxgO9zNwd48T2aXQoB2UWA-T-CEGuIpGb3AtBWbjH0sLLZG51VbLbSOvqoRdLDXmsvNyg/exec";

const questions = [
  {q:"Who is my favourite singer?",a:["Arijit Singh","Sidhu Moosewala","Karan Aujla","Diljit Dosanjh"],c:2},
  {q:"What is my current favourite song?",a:["Antidote","At Peace","HIM.","Ashke"],c:2},
  {q:"What is my favourite clothing brand?",a:["Gucci","Louis Vuitton (LV)","Prada","Dior"],c:1},
  {q:"What is my favourite watch brand?",a:["Rolex","Audemars Piguet","Richard Mille (RM)","Patek Philippe"],c:2},
  {q:"What is my favourite timepass?",a:["Gaming","Listening to songs","Timepass with friends","Watching reels"],c:1},
  {q:"What is my favourite mobile brand?",a:["Vivo","Oppo","Samsung","iPhone"],c:2},
  {q:"What is my favourite shoe brand?",a:["Nike","One8","Jordan","Amiri"],c:3},
  {q:"What is my favourite mobile game?",a:["Free Fire","BGMI","GTA V","Minecraft"],c:3},
  {q:"Who is my favourite YouTuber?",a:["ScoutOP","CarryMinati","GamerFleet","BeastBoyShub"],c:2},
  {q:"What is my favourite car brand?",a:["BMW","Mercedes-Benz","Porsche","Lamborghini"],c:2}
];

let current = 0;
let points = 0;
let chosen = null;
let player = "";
let answers = [];

function startQuiz(){
  player = document.getElementById("playerName").value.trim();
  if(!player){
    alert("Please enter your name or nickname first!");
    return;
  }
  document.getElementById("welcome").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  showQuestion();
}

function showQuestion(){
  chosen = null;
  document.getElementById("next").disabled = true;
  document.getElementById("counter").textContent =
    "Question " + (current+1) + " of " + questions.length;
  document.getElementById("bar").style.width =
    (current/questions.length*100) + "%";
  document.getElementById("question").textContent = questions[current].q;

  const area = document.getElementById("options");
  area.innerHTML = "";

  questions[current].a.forEach((answer,index)=>{
    const button = document.createElement("button");
    button.className = "option";
    button.textContent = answer;
    button.onclick = ()=>selectAnswer(index);
    area.appendChild(button);
  });

  document.getElementById("next").textContent =
    current === questions.length-1 ? "See My Score 🎯" : "Next ➜";
}

function selectAnswer(index){
  if(chosen !== null) return;
  chosen = index;
  const correct = questions[current].c;
  const buttons = document.querySelectorAll(".option");

  buttons.forEach((button,i)=>{
    button.disabled = true;
    if(i === correct) button.classList.add("correct");
    else if(i === index) button.classList.add("wrong");
  });

  if(index === correct) points++;
  answers.push(index);
  document.getElementById("next").disabled = false;
}

function nextQuestion(){
  if(chosen === null) return;
  current++;
  if(current < questions.length) showQuestion();
  else showResult();
}

function showResult(){
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("bar").style.width = "100%";
  document.getElementById("score").textContent = points + " / 10";

  let feedback;
  if(points === 10) feedback = "Wow! You know me perfectly! 🥹💜";
  else if(points >= 7) feedback = "You know me really well! 🔥";
  else if(points >= 4) feedback = "Not bad! But you need to know me better 😄";
  else feedback = "Looks like we need to spend more time together 😂";

  document.getElementById("feedback").textContent = feedback;
  submitScore();
}

function submitScore(){
  const status = document.getElementById("message");
  status.textContent = "Submitting your score…";

  fetch(SCRIPT_URL,{
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({name:player,score:points})
  }).then(()=>{
    status.textContent =
      "Your result has been sent! 💜 If it doesn't appear in the sheet, check the connection.";
  }).catch(()=>{
    status.textContent =
      "Couldn't submit automatically. Please tell the quiz owner your score.";
  });
}

function restartQuiz(){
  current = 0;
  points = 0;
  chosen = null;
  answers = [];
  document.getElementById("playerName").value = "";
  document.getElementById("result").classList.add("hidden");
  document.getElementById("welcome").classList.remove("hidden");
  document.getElementById("bar").style.width = "0%";
}
</script>
</body>
</html>
